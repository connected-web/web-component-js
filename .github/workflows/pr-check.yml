name: Check PR
on:
  pull_request:
    branches:
      - master
jobs:
  test:
    name: Linting and Testing
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm install


      - name: Run default tests
        run: npm test -s
